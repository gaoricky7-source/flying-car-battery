<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞行汽车技术基础 - 作业提交</title>
    <style>
        :root {
            --primary: #0F4C81;
            --secondary: #1a3a5c;
            --accent: #D97706;
            --bg: #f8fafc;
            --text: #333333;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* 加个淡淡的背景纹理提升质感 */
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .container {
            text-align: center;
            background-color: var(--card-bg);
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .student-info {
            font-size: 1.2em;
            color: #1e293b;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .course-info {
            color: #64748b;
            font-size: 0.95em;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 25px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(15, 76, 129, 0.2);
        }
        .btn:hover {
            background-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(217, 119, 6, 0.3);
        }
        .btn span.arrow {
            font-size: 1.2em;
        }
        @media (max-width: 480px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 1.6em; }
            .btn { font-size: 1em; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>飞行汽车技术基础</h1>
        <div class="student-info">15230815 郜瑞奇</div>
        <div class="course-info">课程作业展示页 · 2026年11月</div>
        
        <div class="btn-group">
            <a href="homework1.html" class="btn">
                <span>作业一：技术调研与分析</span>
                <span class="arrow">→</span>
            </a>
            <a href="homework2.html" class="btn">
                <span>作业二：全方位安全分析</span>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

</body>
</html>
